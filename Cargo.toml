[package]
name = "saekawa"
version = "0.5.0-alpha.1"
edition = "2021"
license = "0BSD"

[features]
autoupdate = []

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true      # Automatically strip symbols from the binary.
opt-level = "z"   # Optimize for size.
lto = true
codegen-units = 1
panic = "abort"

[dependencies]
confy = "0.6.1"
dlopen2 = "0.6.0"
env_logger = { version = "0.11.3", default-features = false }
faster-hex = "0.9.0"
jiff = "0.2.37"
lightningscanner = "1.0.2"
log = "0.4.21"
num_enum = "0.7.2"
rand = "0.8.6"
retour = { version = "0.4.0-alpha.4", features = ["static-detour"] }
rust-ini = "0.21.0"
serde = { version = "1.0.203", features = ["derive"] }
serde-aux = { version = "4.5.0", default-features = false }
serde_json = "1.0.117"
sha2 = "0.10.8"
snafu = "0.8.3"
ureq = { version = "2.9.7", features = ["json", "native-tls"] }
url = { version = "2.5.2", features = ["serde"] }
widestring = "1.1.0"

[dependencies.winapi]
version = "0.3.9"
features = [
    "minwindef",
    "winnt",
    "psapi",
    "processthreadsapi",
    "libloaderapi",
    "errhandlingapi",
    "winhttp",
    "synchapi",
    "debugapi",
    "wincon",
    "heapapi",
    "winbase",
    "wincrypt",
    "softpub",
    "wintrust",
    "profileapi",
]

[build-dependencies]
snafu = "0.8.3"
vergen = { version = "8.3.1", features = ["build", "git", "gitcl"] }
